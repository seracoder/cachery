[project]
name = "cachery"
version = "0.1.0"
description = "A fast, type-safe, sync+async caching library for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "cachery contributors" }]
keywords = [
    "cache",
    "caching",
    "async",
    "redis",
    "memoization",
    "ttl",
    "stampede-protection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []  # core is stdlib-only, intentionally

[project.optional-dependencies]
redis = ["redis>=5"]
speed = ["msgspec", "xxhash"]
compress = ["zstandard"]
otel = ["opentelemetry-api"]
prometheus = ["prometheus-client"]
fastapi = ["fastapi"]
all = ["cachery[redis,speed,compress,otel,prometheus,fastapi]"]

[project.scripts]
cachery = "cachery._cli.__main__:main"

[project.entry-points.pytest11]
cachery = "cachery.testing.pytest_plugin"

[project.urls]
Homepage = "https://github.com/seracoder/cachery"
Repository = "https://github.com/seracoder/cachery"
Issues = "https://github.com/seracoder/cachery/issues"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-benchmark",
    "hypothesis",
    "ruff",
    "mypy",
    "pyright",
    "pre-commit",
]
bench = [
    "aiocache",
    "cachery[redis,speed]",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.7,<0.14.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/cachery"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "msgspec.*",
    "xxhash.*",
    "zstandard.*",
    "opentelemetry.*",
    "prometheus_client.*",
    "aiocache.*",
]
ignore_missing_imports = true

[tool.pyright]
include = ["src/cachery"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
reportMissingImports = "none"
reportMissingModuleSource = "none"
# Dynamic boundaries (duck-typed backends, optional msgspec/xxhash paths,
# @wraps-preserving decorators) are intentionally `Any`; mypy --strict
# already guards the meaningful invariants.
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportPrivateUsage = "none"

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "RUF", "PL"]
ignore = [
    "PLR0913",  # decorator/strategy factories legitimately take many options
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLC0415", "PLR0917"]  # fakes mirror library signatures positionally
# examples/perf: function-scoped imports keep each snippet self-contained
"examples/**" = ["PLC0415"]
"perf/**" = ["PLC0415", "F841"]
# scripts: assertion-heavy dev harnesses (magic literals, scoped imports, long smoke functions)
"scripts/**" = ["PLR0915", "PLR2004", "PLC0415"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: requires a real backend (e.g. Redis via testcontainers or REDIS_URL)",
    "benchmark: performance comparisons (deselect with -m 'not benchmark')",
]

[tool.coverage.run]
branch = true
source = ["cachery"]
omit = ["src/cachery/contrib/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
